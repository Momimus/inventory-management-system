; Production PHP settings, applied on top of php.ini-production.

expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Vercel rejects request bodies larger than 4.5 MB, so larger limits would
; never be reached. Product images are limited to 2 MB by validation.
upload_max_filesize = 4M
post_max_size = 4M

; The image is immutable, so PHP files never change after the build.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Logs go to the container's stderr, which Vercel captures.
log_errors = On
error_log = /dev/stderr
display_errors = Off
